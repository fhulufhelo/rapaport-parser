name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zlib, iconv
          coverage: none

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests
        run: vendor/bin/phpunit

  compatibility:
    name: PHP 8.0+ compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHPCompatibility
        run: |
          composer require --dev --no-interaction \
            phpcompatibility/php-compatibility:^9.3 squizlabs/php_codesniffer:^3.7
          vendor/bin/phpcs --config-set installed_paths "$PWD/vendor/phpcompatibility/php-compatibility"

      - name: Check
        run: vendor/bin/phpcs -p --standard=PHPCompatibility --runtime-set testVersion 8.0- --extensions=php src
